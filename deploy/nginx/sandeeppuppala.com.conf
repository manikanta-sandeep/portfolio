# nginx site for sandeeppuppala.com. setup-server.sh installs this file, then certbot
# adds the HTTPS (443) server blocks and the HTTP -> HTTPS redirect to it.

# www -> apex, so the site has one canonical address.
server {
    listen 80;
    listen [::]:80;
    server_name www.sandeeppuppala.com;
    return 301 $scheme://sandeeppuppala.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sandeeppuppala.com;

    root /var/www/sandeeppuppala.com;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # API (server/), running as the portfolio-api systemd service on localhost:3001.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    # Images and PDFs uploaded in /admin, and the sitemap built from the database.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # Vite fingerprints files in /assets, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header in a location replaces any inherited headers, so each location lists them all.
        include /etc/nginx/snippets/sandeeppuppala-security.conf;
    }

    # Single-page app: unknown paths get index.html and the React router renders the page
    # (including its own "Not Found" page). index.html is never cached so deploys show up at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # add_header in a location replaces any inherited headers, so each location lists them all.
        include /etc/nginx/snippets/sandeeppuppala-security.conf;
    }
}
